name: auto_updater
description: This plugin allows Flutter desktop apps to automatically update themselves (based on sparkle and winsparkle).
version: 1.0.0
# This fork is consumed through immutable Git revisions.
publish_to: none
homepage: https://github.com/leanflutter/auto_updater

platforms:
  macos:
  windows:

topics:
  - auto-updater

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  auto_updater_macos:
    git:
      url: https://github.com/Feiyu-Liu/auto_updater.git
      ref: a04f0370c124c426640586aec9e410d26fcd881d
      path: packages/auto_updater_macos
  auto_updater_platform_interface:
    git:
      url: https://github.com/Feiyu-Liu/auto_updater.git
      ref: dae29523565f0230c02708893c31579b18468eea
      path: packages/auto_updater_platform_interface
  auto_updater_windows:
    git:
      url: https://github.com/Feiyu-Liu/auto_updater.git
      ref: dae29523565f0230c02708893c31579b18468eea
      path: packages/auto_updater_windows
  flutter:
    sdk: flutter
  json_annotation: ^4.8.0
  path: ^1.8.3

dev_dependencies:
  build_runner: ^2.3.3
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.0
  mostly_reasonable_lints: ^0.1.2

flutter:
  plugin:
    platforms:
      macos:
        default_package: auto_updater_macos
      windows:
        default_package: auto_updater_windows
